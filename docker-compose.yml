version: "3.9"

services:
  mujoco-backend:
    build: .
    ports:
      - "10000:10000"
    environment:
      - MUJOCO_GL=osmesa
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "10000"]
    restart: unless-stopped
    # Optional: mount a volume for custom MJCF models
    # volumes:
    #   - ./models:/app/models
